name: collect waits

# v3 での変更点
#   v2 は「次の区切りまで走る」作りだった。ところが GitHub は定期実行を
#   予定より3〜4時間遅れて届けてくることが分かった（8:25指定のものが
#   実際には11:30〜12:30に届いていた）。そのため午前がまるごと落ちていた。
#
#   v3 では2つ変える。
#     1. 開園前に届いた場合は、終了せずに 8:30 まで待つ（最大3時間）。
#     2. 区切りで止めず、走れるだけ走る（1回あたり最大5時間20分）。
#   これで「早く届いても遅く届いても拾える」形になる。

on:
  schedule:
    # UTC表記（日本時間は+9時間）。遅延を見越して広くばらまく。
    - cron: "30 20 * * *"   # 日本時間  5:30 → 8:30まで待機
    - cron: "30 21 * * *"   # 日本時間  6:30 → 8:30まで待機
    - cron: "0 23 * * *"    # 日本時間  8:00 → 8:30まで待機
    - cron: "0 1 * * *"     # 日本時間 10:00
    - cron: "0 3 * * *"     # 日本時間 12:00
    - cron: "0 5 * * *"     # 日本時間 14:00
    - cron: "0 7 * * *"     # 日本時間 16:00
    - cron: "0 9 * * *"     # 日本時間 18:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 開園から閉園まで15分おきに取り続ける
        env:
          TZ: Asia/Tokyo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          OPEN=$(date -d "today 08:30" +%s)
          CLOSE=$(date -d "today 22:00" +%s)
          START=$(date +%s)
          MAXWAIT=10800     # 開園まで待てるのは最大3時間
          MAXRUN=19200      # 1回の実行は最大5時間20分

          if [ "$START" -ge "$CLOSE" ]; then
            echo "閉園後に届きました（$(date +%H:%M) JST）。何もせず終わります。"
            exit 0
          fi

          if [ "$START" -lt "$OPEN" ]; then
            WAIT=$((OPEN - START))
            if [ "$WAIT" -gt "$MAXWAIT" ]; then
              echo "開園より $((WAIT / 60)) 分も早く届きました。待ちすぎになるので終わります。"
              exit 0
            fi
            echo "$(date +%H:%M) JST に届きました。開園の 8:30 まで $((WAIT / 60)) 分待ちます。"
            sleep "$WAIT"
          fi

          END=$((START + MAXRUN))
          [ "$END" -gt "$CLOSE" ] && END=$CLOSE
          echo "収集開始 $(date +%H:%M) JST → $(date -d "@$END" +%H:%M) JST まで"

          while true; do
            echo "---- $(date +%H:%M) JST ----"
            python collect.py || echo "この回は取得に失敗しました。次の回に進みます。"

            git add data
            if git diff --staged --quiet; then
              echo "書き足すものはありませんでした。"
            else
              git commit -q -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
              pushed=no
              for i in 1 2 3; do
                if git pull -q --rebase --autostash origin "${GITHUB_REF_NAME}" && git push -q; then
                  pushed=yes; break
                fi
                echo "push に失敗。少し待って再試行します ($i/3)"
                sleep 10
              done
              [ "$pushed" = yes ] || echo "push できませんでした。次の回にまとめて送ります。"
            fi

            now=$(date +%s)
            if [ "$now" -ge "$END" ]; then
              echo "この実行の持ち時間が終わりました。"
              break
            fi
            sleep $(( 900 - (now % 900) ))
          done

          echo "終了 $(date +%H:%M) JST"
